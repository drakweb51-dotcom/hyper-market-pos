<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Spin - Country Flags</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px;
  background: linear-gradient(135deg, #101426, #252044);
  color: white;
  font-family: Arial, sans-serif;
}

.game {
  width: 100%;
  max-width: 390px;
  padding: 25px 18px;
  text-align: center;
  border: 2px solid #e9b949;
  border-radius: 22px;
  background: #191e35;
  box-shadow: 0 10px 35px #0007;
}

h1 {
  margin: 0 0 8px;
  color: #ffd166;
  font-size: 29px;
}

.subtitle {
  color: #c5c9dd;
  font-size: 13px;
}

.balance {
  margin: 22px 0;
  padding: 13px;
  border-radius: 12px;
  background: #292f4c;
  font-size: 18px;
}

#coins {
  color: #ffd166;
  font-weight: bold;
}

.reels {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 24px 0;
}

.reel {
  flex: 1;
  min-width: 0;
  height: 94px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid #e9b949;
  border-radius: 14px;
  background: linear-gradient(#fff, #e9eaf0);
  font-size: clamp(36px, 11vw, 54px);
  box-shadow: inset 0 0 10px #0002;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #ffe08a, #f0ac32);
  color: #20172b;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#message {
  min-height: 28px;
  margin: 20px 0 10px;
  color: #ffe08a;
  font-weight: bold;
}

.reset {
  margin-top: 10px;
  background: #414866;
  color: white;
  font-size: 15px;
}

.footer {
  margin-top: 18px;
  color: #aeb4cb;
  font-size: 11px;
  line-height: 1.5;
}
</style>
</head>

<body>

<main class="game">
  <h1>🌍 LUCKY SPIN</h1>
  <div class="subtitle">COUNTRY FLAGS SLOT GAME</div>

  <div class="balance">
    🪙 Demo Coins: <span id="coins">100</span>
  </div>

  <div class="reels">
    <div class="reel" id="r1">🇧🇩</div>
    <div class="reel" id="r2">🇮🇳</div>
    <div class="reel" id="r3">🇯🇵</div>
  </div>

  <button id="spin">🎰 SPIN — 10 COINS</button>

  <p id="message" aria-live="polite">
    Good luck! Spin to play.
  </p>

  <button class="reset" id="reset">
    ↻ RESET DEMO
  </button>

  <div class="footer">
    Demo game only. Virtual coins have no cash value.
    No real-money deposits or withdrawals.
  </div>
</main>

<script>
// 17 country flag symbols
const symbols = [
  "🇧🇩", // Bangladesh
  "🇮🇳", // India
  "🇵🇰", // Pakistan
  "🇳🇵", // Nepal
  "🇲🇲", // Myanmar
  "🇧🇹", // Bhutan
  "🇺🇸", // USA
  "🇬🇧", // UK
  "🇮🇹", // Italy
  "🇫🇷", // France
  "🇩🇪", // Germany
  "🇷🇺", // Russia
  "🇦🇺", // Australia
  "🇸🇬", // Singapore
  "🇨🇳", // China
  "🇯🇵", // Japan
  "🇰🇷"  // South Korea
];

let coins = 100;
let busy = false;

const coinDisplay = document.getElementById("coins");
const message = document.getElementById("message");
const spinButton = document.getElementById("spin");

const reels = [
  document.getElementById("r1"),
  document.getElementById("r2"),
  document.getElementById("r3")
];

function randomSymbol() {
  return symbols[
    Math.floor(Math.random() * symbols.length)
  ];
}

function updateCoins() {
  coinDisplay.textContent = coins;
}

function spin() {
  if (busy) return;

  if (coins < 10) {
    message.textContent = "Not enough demo coins! Reset to play again.";
    return;
  }

  busy = true;
  spinButton.disabled = true;
  coins -= 10;
  updateCoins();
  message.textContent = "Spinning...";

  // Animate the reels
  let ticks = 0;

  const animation = setInterval(() => {
    reels.forEach(reel => {
      reel.textContent = randomSymbol();
    });

    ticks++;

    if (ticks >= 12) {
      clearInterval(animation);
      finishSpin();
    }
  }, 90);
}

function finishSpin() {
  const results = [
    randomSymbol(),
    randomSymbol(),
    randomSymbol()
  ];

  reels.forEach((reel, index) => {
    reel.textContent = results[index];
  });

  if (
    results[0] === results[1] &&
    results[1] === results[2]
  ) {
    coins += 50;
    message.textContent = "🎉 JACKPOT! +50 demo coins!";
  } else if (
    results[0] === results[1] ||
    results[1] === results[2] ||
    results[0] === results[2]
  ) {
    coins += 20;
    message.textContent = "✨ MATCH! +20 demo coins!";
  } else {
    message.textContent = "No match. Try again!";
  }

  updateCoins();
  busy = false;
  spinButton.disabled = false;
}

spinButton.addEventListener("click", spin);

document.getElementById("reset").addEventListener("click", () => {
  if (busy) return;

  coins = 100;
  updateCoins();

  reels.forEach(reel => {
    reel.textContent = randomSymbol();
  });

  message.textContent = "Demo reset! Good luck!";
  spinButton.disabled = false;
});
</script>

</body>
</html>
